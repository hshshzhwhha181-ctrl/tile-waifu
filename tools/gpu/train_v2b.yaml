# ai-toolkit config used for LoRA tw_heroines_v2b (Z-Image Turbo). Run from /workspace/tw/ai-toolkit:
#   apt-get install -y -q gcc python3.12-dev && pip install -q -r requirements.txt
#   CC=gcc HF_HUB_ENABLE_HF_TRANSFER=1 nohup python3 run.py ../train_v2b.yaml > ../train_v2b.log 2>&1 &
job: extension
config:
  name: tw_heroines_v2b
  process:
    - type: diffusion_trainer
      training_folder: /workspace/tw/output
      device: cuda
      trigger_word: twaifu4 style
      network: {type: lora, linear: 32, linear_alpha: 32}
      save: {dtype: bf16, save_every: 500, max_step_saves_to_keep: 4}
      datasets:
        - folder_path: /workspace/tw/data/v2b
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [768, 1024]
      train:
        batch_size: 1
        steps: 2000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: 0.0001
        dtype: bf16
        ema_config: {use_ema: false}
      model:
        name_or_path: Tongyi-MAI/Z-Image-Turbo
        arch: zimage
        assistant_lora_path: ostris/zimage_turbo_training_adapter/zimage_turbo_training_adapter_v2.safetensors
        quantize: false
      sample:
        sampler: flowmatch
        sample_every: 500
        width: 768
        height: 1152
        prompts:
          - twaifu4 style, anime gacha illustration, mahjong-chan, adult woman with long pink twin tails and mint jade hair ornaments, pink eyes, full body costume card art, fitted mint qipao dress with white lace stockings, sitting sideways on a mahjong table edge swinging one foot, laughing with closed eyes
        neg: ''
        seed: 42
        walk_seed: true
        guidance_scale: 1
        sample_steps: 8
meta: {name: tw_heroines_v2b}
